<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroGrant Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
        }

        #chatbox {
            width: 100%;
            max-width: 600px;
            height: 400px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
            overflow-y: auto;
            padding: 15px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .user {
            background-color: #d1e7dd;
            align-self: flex-end;
            color: #0f5132;
        }

        .bot {
            background-color: #e2e3e5;
            align-self: flex-start;
            color: #41464c;
        }

        #micBtn {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 50px;
            background-color: #198754;
            color: white;
            border: none;
            transition: background-color 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        #micBtn:hover {
            background-color: #157347;
        }

        #micBtn.recording {
            background-color: #dc3545;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <h1>🎙️ AgroGrant Assistant</h1>
    <p>Натисніть на мікрофон та розкажіть про своє підприємство</p>

    <div id="chatbox"></div>
    <button id="micBtn">🎤 Почати розмову</button>

    <script>
        // Генеруємо або дістаємо унікальний ID користувача
        function uuidv4() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        const userId = localStorage.getItem('agrogrant_user_id') || uuidv4();
        localStorage.setItem('agrogrant_user_id', userId);

        const micBtn = document.getElementById('micBtn');
        const chatbox = document.getElementById('chatbox');

        function addMessage(sender, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + (sender === 'Ви' ? 'user' : 'bot');
            div.innerHTML = `<strong>${sender}:</strong><br>${text}`;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        // Ініціалізація Web Speech API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            addMessage('Система', 'Ваш браузер не підтримує розпізнавання голосу. Використовуйте Google Chrome.');
            micBtn.disabled = true;
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'uk-UA';
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                if (micBtn.classList.contains('recording')) {
                    recognition.stop();
                    return;
                }
                recognition.start();
                micBtn.textContent = '🔴 Слухаю вас...';
                micBtn.classList.add('recording');
            });

            recognition.onresult = async (event) => {
                const text = event.results[0][0].transcript;
                addMessage('Ви', text);

                try {
                    // TODO: Замініть URL на адресу вашого бекенду на Render (наприклад, https://agrogrant.onrender.com)
                    const response = await fetch(`https://<ВАША_АДРЕСА_RENDER>/chat/${userId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text })
                    });
                    const data = await response.json();
                    addMessage('AgroGrant', data.reply);

                    // Озвучення відповіді бота
                    const utterance = new SpeechSynthesisUtterance(data.reply);
                    utterance.lang = 'uk-UA';
                    window.speechSynthesis.speak(utterance);

                } catch (error) {
                    addMessage('Система', 'Помилка з\'єднання з сервером. Перевірте, чи працює бекенд.');
                }
            };

            recognition.onspeechend = () => {
                recognition.stop();
                micBtn.textContent = '🎤 Почати розмову';
                micBtn.classList.remove('recording');
            };

            recognition.onerror = (event) => {
                recognition.stop();
                micBtn.textContent = '🎤 Почати розмову';
                micBtn.classList.remove('recording');
                addMessage('Система', 'Помилка мікрофона: ' + event.error);
            };
        }
    </script>
</body>

</html>
